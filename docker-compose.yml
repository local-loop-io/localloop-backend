# Docker's default json-file driver has no size/rotation limit, so container
# logs grow unbounded on the host over time unless capped here explicitly.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build: .
    env_file:
      - .env.docker
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-proxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.localloop-api.rule=Host(`loop-api.urbnia.com`)"
      - "traefik.http.routers.localloop-api.entrypoints=websecure"
      - "traefik.http.routers.localloop-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.localloop-api.loadbalancer.server.port=8088"
    restart: unless-stopped
    networks:
      - default
      - proxy

  postgres:
    image: postgis/postgis:18-3.6
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localloop}
      POSTGRES_USER: ${POSTGRES_USER:-localloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localloop} -d ${POSTGRES_DB:-localloop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M
    # Valkey 9.0 (pinned by digest). Invoked by its own binary names; the
    # redis-* compatibility symlinks are not relied on.
    image: valkey/valkey:9.0@sha256:4f90bb4e87e4df88e48404cc80930a90e21721ba9442d5a5859aedc1472b005d
    security_opt:
      - no-new-privileges:true
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    # "mini" mode bundles master+volume+filer+S3 gateway in one process,
    # matching the single-node MinIO deployment it replaced. No root
    # credentials needed for this mode (S3 API is unauthenticated by
    # default) - nothing in the app currently calls this service at all.
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/seaweedfs:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-proxy:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    image: nginx:1.27-alpine
    security_opt:
      - no-new-privileges:true
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:9200:9000"
    volumes:
      - ./storage-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
