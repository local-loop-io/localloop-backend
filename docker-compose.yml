services:
  api:
    build: .
    env_file:
      - .env.docker
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-proxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.localloop-api.rule=Host(`loop-api.urbnia.com`)"
      - "traefik.http.routers.localloop-api.entrypoints=websecure"
      - "traefik.http.routers.localloop-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.localloop-api.loadbalancer.server.port=8088"
    restart: unless-stopped
    networks:
      - default
      - proxy

  postgres:
    image: postgis/postgis:18-3.6
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localloop}
      POSTGRES_USER: ${POSTGRES_USER:-localloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localloop} -d ${POSTGRES_DB:-localloop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M
    image: valkey/valkey@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    # "mini" mode bundles master+volume+filer+S3 gateway in one process,
    # matching the single-node minio deployment it replaces. No root
    # credentials needed for this mode (S3 API is unauthenticated by
    # default) - nothing in the app currently calls this service at all.
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/seaweedfs:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-proxy:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    image: nginx:1.27-alpine
    security_opt:
      - no-new-privileges:true
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:9200:9000"
    volumes:
      - ./storage-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
