server {
  listen 80;
  server_name loop-api.urbnia.com;

  # Legacy bare-metal alternative to the Traefik labels in docker-compose.yml.
  # Terminate TLS in front of this (or add a listen 443 ssl block); the app
  # trusts exactly one proxy hop (trustProxy: 1 in src/server.ts), so only the
  # address this proxy appends to X-Forwarded-For is used for rate limiting.
  location / {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Server-Sent Events: disable response buffering and lift the read timeout so
  # long-lived streams are delivered as they are written, not held by the proxy.
  location ~ ^/api/(v1/stream|interest/stream)$ {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
  }
}
